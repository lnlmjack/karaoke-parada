<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Tela da TV - Karaokê</title>
    <!-- Incluindo Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; overflow: hidden; font-family: 'Arial', sans-serif;
        }
        
        #youtube-player {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none;
        }

        #overlay-info {
            position: absolute; bottom: 40px; left: 40px; z-index: 10;
            background: rgba(0, 0, 0, 0.8); padding: 20px 30px; border-radius: 15px;
            border-left: 8px solid #e52d27; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            display: none; /* Só aparece quando tem música */
            color: #fff;
        }

        #titulo-musica-overlay {
            font-size: 28px; font-weight: bold; margin: 0 0 5px 0;
        }

        #cantor-overlay {
            font-size: 20px; color: #aaa; margin: 0;
            display: flex; align-items: center; gap: 10px;
        }

        .aviso {
            background: #ffeb3b; color: #000; padding: 3px 8px;
            border-radius: 5px; font-size: 14px; font-weight: bold;
        }

        .nome {
            margin: 0; font-weight: bold; color: #00d2ff;
        }

        #tela-nota {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 20; font-size: 150px; font-weight: 900; color: #ffeb3b;
            text-shadow: 5px 5px 20px rgba(0,0,0,1), -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000;
            display: none; animation: popIn 0.5s ease-out forwards;
        }

        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0.1); opacity: 0; }
            80% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        /* Tela de descanso / QRCode */
        #tela-descanso {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #1e1e1e 0%, #000 100%);
            z-index: 5; display: flex; flex-direction: column;
            align-items: center; justify-content: center; color: white;
        }

        #tela-descanso h1 {
            font-size: 60px; color: #e52d27; margin-bottom: 20px;
            text-shadow: 0 5px 15px rgba(0,0,0,0.8);
        }

        #tela-descanso p {
            font-size: 28px; color: #ccc; margin-bottom: 40px;
        }

        .qr-container {
            background: white; padding: 20px; border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }

        .qr-container img {
            width: 250px; height: 250px; display: block;
        }

        .instrucao-qr {
            margin-top: 15px; font-size: 22px; font-weight: bold; color: #000; text-align: center;
        }

    </style>
</head>
<body>

    <!-- Tela de Descanso com QR Code -->
    <div id="tela-descanso">
        <h1>🍻 Parada 10.95 Bar</h1>
        <p>O palco está livre! Peça sua música pelo celular:</p>
        <div class="qr-container">
            <!-- Coloque a imagem real do seu QR code aqui -->
            <img src="qrcode.png" alt="QR Code para pedir música" onerror="this.src='https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=https://lnlmjack.github.io/karaoke-parada/votacao.html'">
            <div class="instrucao-qr">Aponte a câmera!</div>
        </div>
    </div>

    <!-- Div onde o vídeo do YouTube vai ser injetado -->
    <div id="youtube-player"></div>

    <!-- Informações da Música Tocando -->
    <div id="overlay-info">
        <p id="titulo-musica-overlay">Carregando...</p>
        <div id="cantor-overlay"></div>
    </div>

    <!-- Nota Final -->
    <div id="tela-nota">100</div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        // Configuração do Firebase com suas credenciais
        const firebaseConfig = {
            apiKey: "AIzaSyBMLhTZc7qQLjE65L3BuW9e2ijvxObTxp8",
            authDomain: "karaoke-parada.firebaseapp.com",
            databaseURL: "https://karaoke-parada-default-rtdb.firebaseio.com",
            projectId: "karaoke-parada",
            storageBucket: "karaoke-parada.firebasestorage.app",
            messagingSenderId: "379214932685",
            appId: "1:379214932685:web:873e8b5b7d882a4f751784"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let player;
        let isPlayerReady = false;

        // Quando a API do YouTube carregar, cria o player
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '100%',
                width: '100%',
                playerVars: {
                    'autoplay': 1,
                    'controls': 0, // Esconde os controles
                    'disablekb': 1,
                    'modestbranding': 1,
                    'rel': 0,
                    'showinfo': 0
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            isPlayerReady = true;
            // Informa ao Firebase que o sistema está ativo
            database.ref('sistemaAtivo').set(true);
            
            // Fica escutando a música atual
            database.ref('statusAtual').on('value', (snapshot) => {
                const status = snapshot.val();
                
                if (status && status.videoId && status.id !== "avaliando") {
                    // Tem música tocando
                    document.getElementById('tela-descanso').style.display = 'none';
                    document.getElementById('overlay-info').style.display = 'block';
                    document.getElementById('tela-nota').style.display = 'none';
                    
                    document.getElementById('titulo-musica-overlay').textContent = status.titulo;
                    document.getElementById('cantor-overlay').innerHTML = `
                        <span class="aviso">Com a Voz</span>
                        <p class="nome">${status.cantor}</p>
                    `;
                    
                    player.loadVideoById(status.videoId);
                    player.playVideo();
                } else if (status && status.id === "avaliando") {
                    // Momento da nota
                    document.getElementById('overlay-info').style.display = 'none';
                } else {
                    // Palco livre
                    document.getElementById('tela-descanso').style.display = 'flex';
                    document.getElementById('overlay-info').style.display = 'none';
                    document.getElementById('tela-nota').style.display = 'none';
                    if (player && typeof player.stopVideo === 'function') {
                        player.stopVideo();
                    }
                }
            });
        }

        function onPlayerStateChange(event) {
            // Se o vídeo acabar (estado 0), avisa ao painel
            if (event.data === YT.PlayerState.ENDED) {
                // Aqui você pode implementar a lógica para mostrar a nota automaticamente
                // ou deixar o DJ controlar isso.
                console.log("Vídeo terminou");
            }
        }
        
        // Quando a janela fechar, desativa o sistema
        window.addEventListener("beforeunload", function (e) {
            database.ref('sistemaAtivo').set(false);
        });

    </script>
</body>
</html>

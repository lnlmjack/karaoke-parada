<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Bloqueio rigoroso de cache -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <title>Menu - Karaokê Parada 10.95</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

    <style>
        body { font-family: 'Arial', sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 0; text-align: center; }
        .header { background-color: #e52d27; padding: 15px; font-size: 22px; font-weight: 900; box-shadow: 0 4px 10px rgba(0,0,0,0.5); text-transform: uppercase; letter-spacing: 1px;}

        /* ESTILOS DO MENU PRINCIPAL */
        #menu-principal { padding: 30px 20px; }
        .btn-menu-grande { width: 100%; padding: 30px 20px; margin-bottom: 20px; border: none; border-radius: 15px; font-size: 24px; font-weight: 900; cursor: pointer; transition: 0.2s; box-shadow: 0 8px 15px rgba(0,0,0,0.5); text-transform: uppercase;}
        .btn-menu-grande:active { transform: scale(0.95); }
        .btn-pedir { background: linear-gradient(135deg, #e52d27, #b31217); color: white; border: 2px solid #ff5252;}
        .btn-votar { background: linear-gradient(135deg, #007bff, #0056b3); color: white; border: 2px solid #3399ff;}
        .icone-grande { font-size: 50px; margin-bottom: 10px; display: block;}

        .card { background: #1e1e1e; margin: 15px; padding: 20px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .card h2 { margin-top: 15px; color: #00d2ff; font-size: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }

        .btn-voltar { background: #333; color: #fff; border: 1px solid #555; padding: 10px 15px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; display: inline-block; margin-bottom: 10px; width: 100%;}

        .btn-catalogo { background: #00d2ff; color: #000; width: 100%; padding: 15px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .btn-catalogo:active { transform: scale(0.95); }

        /* CARROSSEL DO ALFABETO */
        .alfabeto-container { display: flex; overflow-x: auto; gap: 8px; margin-bottom: 15px; padding-bottom: 10px; }
        .alfabeto-container::-webkit-scrollbar { height: 6px; }
        .alfabeto-container::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
        .btn-letra { flex: 0 0 auto; background: #333; color: #fff; border: 1px solid #555; border-radius: 8px; padding: 10px 15px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-letra.ativo { background: #00d2ff; color: #000; border-color: #00d2ff; }

        /* Area de Votação */
        #cantor-atual { color: #ffeb3b; font-size: 24px; font-weight: bold; margin: 10px 0; }
        #status-musica { color: #aaa; font-size: 14px; font-style: italic; margin-bottom: 20px; }

        .btn-voto { width: 100%; padding: 16px; margin: 6px 0; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .btn-voto:active { transform: scale(0.95); }
        .v-exc { background: #00d2ff; color: #000; }
        .v-mb { background: #28a745; color: #fff; }
        .v-bom { background: #ffeb3b; color: #000; }
        .v-reg { background: #fd7e14; color: #fff; }
        .v-ruim { background: #e52d27; color: #fff; }

        /* Area de Confirmação de Voto */
        #confirmacao-voto { display: none; background: #222; padding: 20px; border-radius: 8px; border: 2px solid #ffeb3b; margin-top: 10px; }
        .btn-confirmar { background: #28a745; color: white; padding: 12px; border-radius: 8px; border: none; font-weight: bold; width: 48%; margin: 1%; }
        .btn-cancelar { background: #e52d27; color: white; padding: 12px; border-radius: 8px; border: none; font-weight: bold; width: 48%; margin: 1%; }

        /* Mensagem de Agradecimento */
        #msg-agradecimento { display: none; background: #222; padding: 20px; border-radius: 8px; border: 2px solid #28a745; margin-top: 10px; }

        /* Notificação de Pedido Enviado */
        #notificacao { display: none; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background-color: #28a745; color: white; padding: 15px 25px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.3); z-index: 1000; font-size: 18px; font-weight: bold; }

        /* Estilos para a busca de música */
        #busca-musica, #catalogo-musicas, #votar-cantor { display: none; padding: 20px; }
        #campoBusca, #buscaCatalogo { width: calc(100% - 22px); padding: 10px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #555; background-color: #333; color: #fff; font-size: 16px; }
        #btnBuscar { background: linear-gradient(135deg, #00d2ff, #007bff); color: #000; width: 100%; padding: 15px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        #btnBuscar:active { transform: scale(0.95); }
        #resultados, #lista-catalogo { max-height: 300px; overflow-y: auto; border: 1px solid #333; border-radius: 8px; margin-top: 15px; }
        .item-resultado { background: #222; padding: 12px; margin-bottom: 8px; border-radius: 8px; text-align: left; cursor: pointer; transition: background-color 0.2s; }
        .item-resultado:hover { background-color: #333; }
        .item-resultado:last-child { margin-bottom: 0; }

        .version-info { position: fixed; bottom: 5px; right: 5px; font-size: 0.8em; color: #888; }
    </style>
</head>
<body>
    <div class="header">
        🍻 Parada 10.95 Bar
    </div>

    <div id="menu-principal">
        <button class="btn-menu-grande btn-pedir" onclick="mostrarAba('pedir')">
            <span class="icone-grande">📩</span>
            Pedir Música
        </button>
        <button class="btn-menu-grande btn-votar" onclick="mostrarAba('votar')">
            <span class="icone-grande">⭐</span>
            Votar no Cantor
        </button>
    </div>

    <div id="busca-musica" class="card">
        <h2>📩 Escolha sua Música</h2>
        <button class="btn-catalogo" onclick="mostrarAba('catalogo')">
            <span class="icone-grande" style="font-size: 30px;">🗂️</span> Explorar Catálogo de Músicas
        </button>
        <p>Ou pesquise livremente no YouTube:</p>
        <input type="text" id="campoBusca" placeholder="Nome da música ou artista">
        <button id="btnBuscar" onclick="buscarMusica()">
            <span class="icone-grande" style="font-size: 30px;">🔍</span> Buscar no YouTube
        </button>
        <div id="resultados">
            <!-- Resultados da busca do YouTube serão exibidos aqui -->
        </div>
        <button class="btn-voltar" onclick="mostrarAba('menu')">⬅️ Voltar ao Menu</button>
    </div>

    <div id="catalogo-musicas" class="card">
        <h2>🗂️ Catálogo Completo</h2>
        <div class="alfabeto-container" id="alfabeto-container">
            <button class="btn-letra ativo" id="btn-letra-TODOS" onclick="filtrarPorLetra('TODOS')">TODOS</button>
            <!-- Botões do alfabeto serão gerados aqui -->
        </div>
        <input type="text" id="buscaCatalogo" placeholder="Buscar no catálogo..." onkeyup="filtrarCatalogo()">
        <div id="lista-catalogo">
            Carregando músicas...
        </div>
        <button class="btn-voltar" onclick="mostrarAba('pedir')">⬅️ Voltar para a Busca</button>
    </div>

    <div id="votar-cantor" class="card">
        <h2>🎤 No Palco Agora</h2>
        <p id="cantor-atual">Aguardando...</p>
        <p id="status-musica">Preste atenção na TV!</p>

        <div id="lista-botoes">
            <p>O que você achou da apresentação?</p>
            <button class="btn-voto v-exc" onclick="prepararVoto('excelente', 'Excelente')">🤯 Excelente</button>
            <button class="btn-voto v-mb" onclick="prepararVoto('muito_bom', 'Muito Bom')">🤩 Muito Bom</button>
            <button class="btn-voto v-bom" onclick="prepararVoto('bom', 'Bom')">🙂 Bom</button>
            <button class="btn-voto v-reg" onclick="prepararVoto('regular', 'Regular')">😕 Regular</button>
            <button class="btn-voto v-ruim" onclick="prepararVoto('ruim', 'Ruim')">😖 Ruim</button>
        </div>

        <div id="confirmacao-voto">
            <p>Confirmar voto: <strong id="texto-voto-escolhido"></strong></p>
            <button class="btn-cancelar" onclick="cancelarVoto()">❌ Cancelar</button>
            <button class="btn-confirmar" onclick="confirmarVoto()">✅ Votar!</button>
        </div>

        <div id="msg-agradecimento">
            <p>✅ Voto registrado!</p>
        </div>

        <button class="btn-voltar" onclick="mostrarAba('menu')">⬅️ Voltar ao Menu</button>
    </div>

    <div id="notificacao">
        ✅ Pedido enviado ao DJ!
    </div>

    <div class="version-info">v1.1</div>

    <script>
        // Firebase configuration (SUBSTITUA COM SUAS CREDENCIAIS)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            databaseURL: "YOUR_DATABASE_URL",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const API_KEY = 'YOUR_YOUTUBE_API_KEY'; // Sua chave da API do YouTube

        let musicasCatalogo = [];
        let idCantorAtual = null;
        let votoPendente = null;

        function mostrarAba(aba) {
            document.getElementById('menu-principal').style.display = 'none';
            document.getElementById('busca-musica').style.display = 'none';
            document.getElementById('catalogo-musicas').style.display = 'none';
            document.getElementById('votar-cantor').style.display = 'none';

            document.getElementById(aba + '-principal' || aba).style.display = 'block';
        }

        document.addEventListener('DOMContentLoaded', () => {
            mostrarAba('menu');
            gerarBotoesAlfabeto();
        });

        function gerarBotoesAlfabeto() {
            const container = document.getElementById('alfabeto-container');
            // Adiciona o botão "TODOS" no início
            const btnTodos = document.createElement('button');
            btnTodos.className = 'btn-letra';
            btnTodos.id = 'btn-letra-TODOS';
            btnTodos.innerText = 'TODOS';
            btnTodos.onclick = () => filtrarPorLetra('TODOS');
            container.appendChild(btnTodos);

            for (let i = 65; i <= 90; i++) { // Letras de A a Z
                const letra = String.fromCharCode(i);
                const btn = document.createElement('button');
                btn.className = 'btn-letra';
                btn.id = 'btn-letra-' + letra;
                btn.innerText = letra;
                btn.onclick = () => filtrarPorLetra(letra);
                container.appendChild(btn);
            }
        }

        function filtrarPorLetra(letra) {
            document.querySelectorAll('.btn-letra').forEach(b => b.classList.remove('ativo'));
            document.getElementById('btn-letra-' + letra).classList.add('ativo');
            document.getElementById('buscaCatalogo').value = ''; // Limpa a busca por texto

            if (letra === 'TODOS') {
                renderizarCatalogo(musicasCatalogo.slice(0, 150));
            } else {
                const filtrados = musicasCatalogo.filter(m => m.cantor.toUpperCase().startsWith(letra)).slice(0, 150);
                renderizarCatalogo(filtrados);
            }
        }

        async function carregarCatalogo() {
            try {
                const response = await fetch('catalogo.csv?v=' + new Date().getTime()); // Adiciona timestamp para evitar cache
                const text = await response.text();

                const delimitador = text.split('\n')[0].includes(';') ? ';' : ',';
                let linhas = text.split('\n');

                let headers = [];
                let celulaH = ''; let aspasH = false;
                let linhaH = linhas[0].trim();
                for(let j = 0; j < linhaH.length; j++) {
                    let char = linhaH[j];
                    if(char === '"') aspasH = !aspasH;
                    else if (char === delimitador && !aspasH) { headers.push(celulaH.trim().toUpperCase()); celulaH = ''; }
                    else celulaH += char;
                }
                headers.push(celulaH.trim().toUpperCase());

                let idxCantor = 0, idxTitulo = 2, idxInicio = 3;
                headers.forEach((h, i) => {
                    if (h.includes('CANTOR')) idxCantor = i;
                    if (h.includes('TÍTULO') || h.includes('TITULO') || h === 'MUSICA' || h === 'MÚSICA') idxTitulo = i;
                    if (h.includes('INÍCIO') || h.includes('INICIO') || h.includes('LETRA')) idxInicio = i;
                });

                for (let i = 1; i < linhas.length; i++) {
                    let linha = linhas[i].trim();
                    if (!linha) continue;

                    let colunas = [];
                    let celula = '';
                    let aspas = false;
                    for(let j = 0; j < linha.length; j++) {
                        let char = linha[j];
                        if(char === '"') aspas = !aspas;
                        else if (char === delimitador && !aspas) {
                            colunas.push(celula.trim()); celula = '';
                        } else celula += char;
                    }
                    colunas.push(celula.trim());

                    if (colunas.length > Math.max(idxCantor, idxTitulo)) {
                        let cantor = colunas[idxCantor] ? colunas[idxCantor].replace(/^"|"$/g, '').trim() : '';
                        let titulo = colunas[idxTitulo] ? colunas[idxTitulo].replace(/^"|"$/g, '').trim() : '';
                        let inicio = colunas[idxInicio] ? colunas[idxInicio].replace(/^"|"$/g, '').trim() : '';

                        if(cantor && titulo) {
                            musicasCatalogo.push({ 
                                cantor: cantor, 
                                titulo: titulo, 
                                inicio: inicio,
                                filtro: (cantor + " " + titulo + " " + inicio).toLowerCase() 
                            });
                        }
                    }
                }

                musicasCatalogo.sort((a, b) => a.cantor.localeCompare(b.cantor, 'pt-BR'));
                renderizarCatalogo(musicasCatalogo.slice(0, 150)); 
            } catch(e) {
                document.getElementById('lista-catalogo').innerHTML = '<p style="color:#e52d27; text-align:center;">Catálogo offline. Peça digitando na busca principal.</p>';
                console.error("Erro ao carregar catálogo CSV:", e);
            }
        }

        function renderizarCatalogo(lista) {
            const div = document.getElementById('lista-catalogo');
            div.innerHTML = '';
            if(lista.length === 0) {
                div.innerHTML = '<p style="text-align:center; color:#aaa;">Nenhuma música encontrada.</p>';
                return;
            }
            let html = '';
            lista.forEach(m => {
                let tituloEscapado = m.titulo.replace(/'/g, "\\'").replace(/"/g, "&quot;");
                let cantorEscapado = m.cantor.replace(/'/g, "\\'").replace(/"/g, "&quot;");

                html += `
                <div class="item-resultado" onclick="selecionarDoCatalogo('${tituloEscapado}', '${cantorEscapado}')">
                    <strong style="font-size: 18px; display: block; margin-bottom: 5px;">🎤 ${m.cantor}</strong>
                    <span style="font-size: 16px; color: #fff; display: block; margin-bottom: 3px;">🎵 ${m.titulo}</span>
                    ${m.inicio ? `<span style="font-size: 13px; color: #aaa; display: block; font-style: italic;">📝 ${m.inicio}</span>` : ''}
                </div>`;
            });
            div.innerHTML = html;
        }

        function filtrarCatalogo() {
            document.querySelectorAll('.btn-letra').forEach(b => b.classList.remove('ativo'));
            document.getElementById('btn-letra-TODOS').classList.add('ativo'); // Ativa "TODOS" ao buscar por texto

            const termo = document.getElementById('buscaCatalogo').value.toLowerCase();
            if (!termo) {
                renderizarCatalogo(musicasCatalogo.slice(0, 150));
                return;
            }
            const filtrados = musicasCatalogo.filter(m => m.filtro.includes(termo)).slice(0, 150);
            renderizarCatalogo(filtrados);
        }

        function selecionarDoCatalogo(titulo, cantor) {
            mostrarAba('busca-musica'); // Volta para a aba de busca para preencher o campo
            document.getElementById('campoBusca').value = titulo + " " + cantor;
            buscarMusica(); 
        }

        window.onload = () => { carregarCatalogo(); };

        // Listener para o status da música atual na TV
        database.ref('statusAtual').on('value', (snapshot) => {
            const status = snapshot.val();
            if (status && status.id !== "avaliando") {
                document.getElementById('cantor-atual').innerText = "Voz: " + status.cantor;
                document.getElementById('status-musica').innerText = "🎵 " + status.titulo;
                idCantorAtual = status.id;

                if (localStorage.getItem('voto_' + idCantorAtual)) {
                    bloquearVoto();
                } else {
                    liberarVoto();
                }
            } else if (status && status.id === "avaliando") {
                document.getElementById('cantor-atual').innerText = "Calculando as Notas...";
                document.getElementById('status-musica').innerText = "Olhe para a tela da TV!";
                esconderVoto();
            } else {
                document.getElementById('cantor-atual').innerText = "Palco Livre!";
                document.getElementById('status-musica').innerText = "Nenhuma música tocando no momento.";
                esconderVoto();
            }
        });

        function liberarVoto() {
            document.getElementById('lista-botoes').style.display = 'block';
            document.getElementById('confirmacao-voto').style.display = 'none';
            document.getElementById('msg-agradecimento').style.display = 'none';
            votoPendente = null;
        }

        function esconderVoto() {
            document.getElementById('lista-botoes').style.display = 'none';
            document.getElementById('confirmacao-voto').style.display = 'none';
            document.getElementById('msg-agradecimento').style.display = 'none';
            votoPendente = null;
        }

        function bloquearVoto() {
            document.getElementById('lista-botoes').style.display = 'none';
            document.getElementById('confirmacao-voto').style.display = 'none';
            document.getElementById('msg-agradecimento').style.display = 'block';
            votoPendente = null;
        }

        function prepararVoto(tipo, texto) {
            votoPendente = tipo;
            document.getElementById('texto-voto-escolhido').innerText = texto;
            document.getElementById('lista-botoes').style.display = 'none';
            document.getElementById('confirmacao-voto').style.display = 'block';
        }

        function cancelarVoto() {
            votoPendente = null;
            document.getElementById('confirmacao-voto').style.display = 'none';
            document.getElementById('lista-botoes').style.display = 'block';
        }

        function confirmarVoto() {
            if (!votoPendente || !idCantorAtual) return;

            database.ref('votosAtual').push({ tipo: votoPendente });
            localStorage.setItem('voto_' + idCantorAtual, 'sim');
            bloquearVoto();
        }

        document.getElementById('campoBusca').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') buscarMusica();
        });

        async function buscarMusica() {
            const termo = document.getElementById('campoBusca').value;
            if (!termo) return alert("Digite o nome de uma música!");

            const div = document.getElementById('resultados');
            div.innerHTML = '<p style="text-align:center; color:#00d2ff;">Buscando no YouTube...</p>'; 

            const query = encodeURIComponent(termo + " karaoke -oficial -clipe -live");
            const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=5&q=${query}&type=video&key=${API_KEY}`;

            try {
                const res = await fetch(url); 
                const dados = await res.json();
                div.innerHTML = '';

                if(dados.items.length === 0) {
                    div.innerHTML = '<p style="color:#e52d27;">Música não encontrada. Tente outro nome.</p>';
                    return;
                }

                dados.items.forEach(v => {
                    const btn = document.createElement('div');
                    btn.className = 'item-resultado';
                    btn.innerHTML = `<strong>${v.snippet.title}</strong><br><span style="font-size:12px; color:#aaa;">Clique para escolher</span>`; 

                    btn.onclick = () => fazerPedido(v.id.videoId, v.snippet.title, 'youtube');
                    div.appendChild(btn);
                });
            } catch (err) { 
                div.innerHTML = "<p style='color:#e52d27'>Erro ao buscar. Chame o DJ.</p>"; 
                console.error("Erro na busca do YouTube:", err);
            }
        }

        function fazerPedido(videoId, titulo, source) {
            const nomeCantor = prompt("Música selecionada! Qual o seu nome (Voz)?");

            if (nomeCantor !== null && nomeCantor.trim() !== "") {
                // A lógica de auto-aprovar é do DJ, então o pedido do cliente sempre vai para 'pedidos'
                database.ref('pedidos').push({
                    videoId: videoId,
                    titulo: titulo,
                    cantor: nomeCantor.trim(),
                    source: source,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                }).then(() => {
                    document.getElementById('campoBusca').value = "";
                    document.getElementById('resultados').innerHTML = "";

                    mostrarAba('menu'); 
                    const notif = document.getElementById('notificacao');
                    notif.style.display = 'block';
                    setTimeout(() => notif.style.display = 'none', 4000);
                }).catch(error => {
                    console.error("Erro ao fazer pedido:", error);
                    alert("Erro ao enviar pedido de música.");
                });
            }
        }
    </script>
</body>
</html>

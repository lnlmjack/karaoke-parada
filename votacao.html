<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pedir e Votar - Karaokê Parada 10.95</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 0; text-align: center; }
        .header { background-color: #e52d27; padding: 15px; font-size: 22px; font-weight: 900; box-shadow: 0 4px 10px rgba(0,0,0,0.5); text-transform: uppercase; letter-spacing: 1px;}
        
        .card { background: #1e1e1e; margin: 20px; padding: 20px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .card h2 { margin-top: 0; color: #00d2ff; font-size: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        
        /* Area de Votação */
        #cantor-atual { color: #ffeb3b; font-size: 24px; font-weight: bold; margin: 10px 0; }
        #status-musica { color: #aaa; font-size: 14px; font-style: italic; margin-bottom: 20px; }
        
        .btn-voto { width: 100%; padding: 16px; margin: 6px 0; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .btn-voto:active { transform: scale(0.95); }
        .v-exc { background: #00d2ff; color: #000; }
        .v-mb { background: #28a745; color: #fff; }
        .v-bom { background: #ffeb3b; color: #000; }
        .v-reg { background: #fd7e14; color: #fff; }
        .v-ruim { background: #e52d27; color: #fff; }
        .v-desativado { background: #444 !important; color: #777 !important; pointer-events: none; }

        /* Area de Busca */
        input { width: 100%; box-sizing: border-box; padding: 15px; border-radius: 8px; border: 1px solid #333; background: #111; color: #fff; font-size: 16px; margin-bottom: 15px; }
        .btn-busca { background: #e52d27; color: #fff; width: 100%; padding: 15px; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .btn-busca:active { background: #c21a15; }
        
        #resultados { margin-top: 20px; text-align: left; }
        .item-resultado { background: #2a2a2a; padding: 15px; margin-bottom: 10px; border-radius: 8px; border-left: 5px solid #00d2ff; font-size: 15px; line-height: 1.4; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        .item-resultado:active { background: #333; }
        
        /* Notificação Sucesso */
        #notificacao { display: none; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #28a745; color: white; padding: 15px 25px; border-radius: 30px; font-weight: bold; font-size: 16px; z-index: 1000; box-shadow: 0 5px 15px rgba(0,0,0,0.6); }
    </style>
</head>
<body>

    <div class="header">
        🍻 Parada 10.95 Bar
    </div>

    <!-- SESSÃO 1: QUEM ESTÁ CANTANDO E VOTAÇÃO -->
    <div class="card" id="area-votacao">
        <h2>🎤 No Palco Agora</h2>
        <div id="status-palco">
            <div id="cantor-atual">Aguardando...</div>
            <div id="status-musica">Preste atenção na TV!</div>
        </div>

        <div id="botoes-voto" style="display: none;">
            <p style="margin-bottom: 10px; font-size: 14px; color: #ccc;">O que você achou da apresentação?</p>
            <button class="btn-voto v-exc" onclick="enviarVoto('excelente')">🤯 Excelente</button>
            <button class="btn-voto v-mb" onclick="enviarVoto('muitobom')">🤩 Muito Bom</button>
            <button class="btn-voto v-bom" onclick="enviarVoto('bom')">🙂 Bom</button>
            <button class="btn-voto v-reg" onclick="enviarVoto('regular')">😕 Regular</button>
            <button class="btn-voto v-ruim" onclick="enviarVoto('ruim')">😖 Ruim</button>
        </div>
        <div id="msg-agradecimento" style="display: none; color: #28a745; font-weight: bold; font-size: 18px; margin-top: 20px;">
            ✅ Voto registrado!
        </div>
    </div>

    <!-- SESSÃO 2: PEDIR MÚSICA -->
    <div class="card">
        <h2 style="color: #ffeb3b;">📩 Pedir uma Música</h2>
        <p style="font-size: 14px; color: #ccc; margin-bottom: 15px;">Busque o nome da música e o cantor. Nós já filtramos as versões Karaokê para você!</p>
        
        <input type="text" id="campoBusca" placeholder="Ex: Evidências Chitãozinho...">
        <button class="btn-busca" onclick="buscarMusica()">🔍 Buscar Música</button>
        
        <div id="resultados"></div>
    </div>

    <div id="notificacao">✅ Pedido enviado ao DJ!</div>

    <script>
        // CONFIGURAÇÃO FIREBASE (A mesma do Painel do DJ)
        const firebaseConfig = {
            apiKey: "AIzaSyBMLhTZc7qQLjE65L3BuW9e2ijvxObTxp8",
            authDomain: "karaoke-parada.firebaseapp.com",
            databaseURL: "https://karaoke-parada-default-rtdb.firebaseio.com",
            projectId: "karaoke-parada",
            storageBucket: "karaoke-parada.firebasestorage.app",
            messagingSenderId: "379214932685",
            appId: "1:379214932685:web:873e8b5b7d882a4f751784"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const API_KEY = 'AIzaSyALlAfsayUGb0Y7CJrfinrPUqE6_QbEyU4'; 
        let idCantorAtual = null;

        // OUVINTE DA TV (Para saber quem está cantando e liberar votação)
        database.ref('statusAtual').on('value', (snapshot) => {
            const status = snapshot.val();
            
            if (status && status.id !== "avaliando") {
                // Alguém está cantando
                document.getElementById('cantor-atual').innerText = "Voz: " + status.cantor;
                document.getElementById('status-musica').innerText = "🎵 " + status.titulo;
                idCantorAtual = status.id;

                // Verifica se o cliente já votou neste cantor específico
                if (localStorage.getItem('voto_' + idCantorAtual)) {
                    bloquearVoto();
                } else {
                    liberarVoto();
                }
            } else if (status && status.id === "avaliando") {
                // Suspense / Nota final
                document.getElementById('cantor-atual').innerText = "Calculando as Notas...";
                document.getElementById('status-musica').innerText = "Olhe para a tela da TV!";
                esconderVoto();
            } else {
                // Palco Vazio
                document.getElementById('cantor-atual').innerText = "Palco Livre!";
                document.getElementById('status-musica').innerText = "Faça o seu pedido abaixo.";
                esconderVoto();
            }
        });

        // FUNÇÕES DE VOTAÇÃO
        function liberarVoto() {
            document.getElementById('botoes-voto').style.display = 'block';
            document.getElementById('msg-agradecimento').style.display = 'none';
        }

        function esconderVoto() {
            document.getElementById('botoes-voto').style.display = 'none';
            document.getElementById('msg-agradecimento').style.display = 'none';
        }

        function bloquearVoto() {
            document.getElementById('botoes-voto').style.display = 'none';
            document.getElementById('msg-agradecimento').style.display = 'block';
        }

        function enviarVoto(tipoVoto) {
            if (!idCantorAtual) return;

            // Envia o voto pro banco de dados
            database.ref('votosAtual').push({ tipo: tipoVoto });

            // Trava o voto no celular do cliente para ele não votar 50 vezes no mesmo amigo
            localStorage.setItem('voto_' + idCantorAtual, 'sim');
            bloquearVoto();
        }

        // BUSCA DE MÚSICAS NO YOUTUBE
        document.getElementById('campoBusca').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') buscarMusica();
        });

        async function buscarMusica() {
            const termo = document.getElementById('campoBusca').value;
            if (!termo) return alert("Digite o nome de uma música!");
            
            const div = document.getElementById('resultados');
            div.innerHTML = '<p style="text-align:center; color:#00d2ff;">Buscando no acervo...</p>'; 

            // Filtro para buscar sempre versão Karaokê
            const query = encodeURIComponent(termo + " karaoke -oficial -clipe -live");
            const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=5&q=${query}&type=video&key=${API_KEY}`;
            
            try {
                const res = await fetch(url); 
                const dados = await res.json();
                div.innerHTML = '';
                
                if(dados.items.length === 0) {
                    div.innerHTML = '<p style="color:#e52d27;">Música não encontrada. Tente outro nome.</p>';
                    return;
                }

                dados.items.forEach(v => {
                    const btn = document.createElement('div');
                    btn.className = 'item-resultado';
                    btn.innerHTML = `<strong>${v.snippet.title}</strong><br><span style="font-size:12px; color:#aaa;">Clique para escolher</span>`; 
                    
                    btn.onclick = () => fazerPedido(v.id.videoId, v.snippet.title);
                    div.appendChild(btn);
                });
            } catch (err) { 
                div.innerHTML = "<p style='color:#e52d27'>Erro ao buscar. Chame o DJ.</p>"; 
            }
        }

        // ENVIAR O PEDIDO PRO PAINEL DO DJ
        function fazerPedido(videoId, titulo) {
            const nomeCantor = prompt("Música selecionada! Qual o seu nome (Voz)?");
            
            if (nomeCantor !== null && nomeCantor.trim() !== "") {
                database.ref('pedidos').push({
                    videoId: videoId,
                    titulo: titulo,
                    cantor: nomeCantor.trim()
                }).then(() => {
                    document.getElementById('campoBusca').value = "";
                    document.getElementById('resultados').innerHTML = "";
                    
                    // Mostra aviso de sucesso
                    const notif = document.getElementById('notificacao');
                    notif.style.display = 'block';
                    setTimeout(() => notif.style.display = 'none', 4000);
                });
            }
        }
    </script>
</body>
</html>

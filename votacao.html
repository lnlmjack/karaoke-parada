<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedir Música e Votar - Parada 10.95</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; padding: 15px; margin: 0; text-align: center; }
        .container { max-width: 500px; margin: 0 auto; }
        
        .secao { background: #1e1e1e; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h1, h2 { color: #e52d27; font-size: 22px; }
        
        input { width: 100%; padding: 12px; border-radius: 6px; border: none; font-size: 16px; margin-bottom: 12px; box-sizing: border-box; background: #333; color: #fff; }
        .btn { width: 100%; padding: 12px; background: #e52d27; color: white; border: none; font-weight: bold; font-size: 16px; border-radius: 6px; cursor: pointer; }
        .btn:hover { background: #c21a15; }

        .item-resultado { display: flex; align-items: center; gap: 10px; background: #333; padding: 10px; margin: 8px 0; border-radius: 6px; text-align: left; cursor: pointer; transition: 0.2s; }
        .item-resultado:hover { background: #e52d27; }
        .item-resultado img { width: 70px; height: 50px; object-fit: cover; border-radius: 4px; flex-shrink: 0; }
        .info-resultado { flex: 1; display: flex; flex-direction: column; }
        .info-resultado .titulo-video { font-size: 13px; font-weight: bold; line-height: 1.2; }
        .info-resultado .nome-canal { font-size: 11px; color: #00d2ff; margin-top: 4px; font-weight: bold; }

        /* Estilos dos botões de voto */
        .grid-votos { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 15px; }
        .btn-voto { padding: 15px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; color: white; transition: transform 0.1s; }
        .btn-voto:active { transform: scale(0.95); }
        .v-excelente { background: #00d2ff; color: #000; }
        .v-muitobom { background: #28a745; }
        .v-bom { background: #ffeb3b; color: #000; }
        .v-regular { background: #fd7e14; }
        .v-ruim { background: #e52d27; }

        #painel-votacao { display: none; }
        #status-musica-atual { font-size: 18px; color: #ffeb3b; margin: 15px 0; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎤 Parada 10.95 Bar</h1>
        
        <!-- SEÇÃO DE PEDIR MÚSICA -->
        <div class="secao" id="painel-pedido">
            <h2>Pedir Música</h2>
            <input type="text" id="nomeCantorPedido" placeholder="Seu Nome ou Dupla...">
            <input type="text" id="termoBuscaCliente" placeholder="Nome da música ou artista..." onkeypress="if(event.key === 'Enter') buscarMusicaCliente()">
            <button class="btn" onclick="buscarMusicaCliente()">Buscar no YouTube</button>
            <div id="resultadosCliente" style="margin-top: 15px; max-height: 350px; overflow-y: auto;"></div>
        </div>

        <!-- SEÇÃO DE VOTAÇÃO AO VIVO -->
        <div class="secao" id="painel-votacao">
            <h2>⭐ Votar na Apresentação</h2>
            <div id="status-musica-atual">Aguardando a próxima música...</div>
            <div id="botoes-voto-container" style="display:none;">
                <p style="font-size: 14px; color: #aaa;">O que achou desta performance?</p>
                <div class="grid-votos">
                    <button class="btn-voto v-excelente" onclick="enviarVoto('excelente')">🤯 Excelente!</button>
                    <button class="btn-voto v-muitobom" onclick="enviarVoto('muitobom')">🤩 Muito Bom!</button>
                    <button class="btn-voto v-bom" onclick="enviarVoto('bom')">🙂 Bom</button>
                    <button class="btn-voto v-regular" onclick="enviarVoto('regular')">😕 Regular</button>
                    <button class="btn-voto v-ruim" onclick="enviarVoto('ruim')">😖 Ruim</button>
                </div>
            </div>
            <div id="mensagem-votado" style="display:none; color: #28a745; font-weight: bold; margin-top: 15px; font-size: 18px;">
                ✅ Voto registrado com sucesso! Obrigado!
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBMLhTZc7qQLjE65L3BuW9e2ijvxObTxp8",
            authDomain: "karaoke-parada.firebaseapp.com",
            databaseURL: "https://karaoke-parada-default-rtdb.firebaseio.com",
            projectId: "karaoke-parada",
            storageBucket: "karaoke-parada.firebasestorage.app",
            messagingSenderId: "379214932685",
            appId: "1:379214932685:web:936382160fc3ec07751784"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const API_KEY = 'AIzaSyALlAfsayUGb0Y7CJrfinrPUqE6_QbEyU4';

        // Puxa os canais favoritos salvos (ou usa o padrão)
        let canaisFavoritos = JSON.parse(localStorage.getItem('canaisFavoritos')) || [
            "Muramatsu Karaoke",
            "Tequila Karaoke",
            "Versão Karaokê"
        ];

        let idVotacaoAtual = null;
        let ja VotadoNestaMusica = false;

        // Monitora qual música está tocando para liberar a votação ao vivo
        database.ref('statusAtual').on('value', (snapshot) => {
            const status = snapshot.val();
            const painelVotacao = document.getElementById('painel-votacao');
            const statusMusica = document.getElementById('status-musica-atual');
            const btnVotosContainer = document.getElementById('botoes-voto-container');
            const msgVotado = document.getElementById('mensagem-votado');

            painelVotacao.style.display = 'block';

            if (status && status.id) {
                if (idVotacaoAtual !== status.id) {
                    idVotacaoAtual = status.id;
                    jaVotadoNestaMusica = false;
                    msgVotado.style.display = 'none';
                    btnVotosContainer.style.display = 'block';
                }
                statusMusica.innerHTML = `Cantando agora:<br><span style="color:#fff;">${status.cantor}</span><br><span style="font-size:14px; color:#aaa;">${status.titulo}</span>`;
            } else {
                idVotacaoAtual = null;
                statusMusica.innerHTML = "Aguardando a próxima música começar...";
                btnVotosContainer.style.display = 'none';
                msgVotado.style.display = 'none';
            }
        });

        async function buscarMusicaCliente() {
            const cantor = document.getElementById('nomeCantorPedido').value.trim();
            const termo = document.getElementById('termoBuscaCliente').value.trim();
            const divResultados = document.getElementById('resultadosCliente');

            if (!cantor) return alert("Por favor, digite o seu nome antes de buscar!");
            if (!termo) return alert("Digite o nome da música que deseja buscar!");

            divResultados.innerHTML = "<p style='color:#aaa;'>Buscando versões de karaokê...</p>";

            const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=15&q=${encodeURIComponent(termo + " karaoke -oficial -clipe -live")}&type=video&key=${API_KEY}`;
            try {
                const res = await fetch(url);
                const dados = await res.json();
                divResultados.innerHTML = "";

                if (!dados.items || dados.items.length === 0) {
                    divResultados.innerHTML = "<p style='color:#e52d27;'>Nenhuma música encontrada.</p>";
                    return;
                }

                // ORDENAÇÃO INTELIGENTE POR CANAIS FAVORITOS (Mesma regra do painel)
                let itensOrdenados = [...dados.items].sort((a, b) => {
                    let tituloA = a.snippet.title.toLowerCase();
                    let canalA = a.snippet.channelTitle.toLowerCase();
                    let indexA = canaisFavoritos.findIndex(c => tituloA.includes(c.toLowerCase()) || canalA.includes(c.toLowerCase()));

                    let tituloB = b.snippet.title.toLowerCase();
                    let canalB = b.snippet.channelTitle.toLowerCase();
                    let indexB = canaisFavoritos.findIndex(c => tituloB.includes(c.toLowerCase()) || canalB.includes(c.toLowerCase()));

                    if (indexA !== -1 && indexB !== -1) return indexA - indexB;
                    if (indexA !== -1) return -1;
                    if (indexB !== -1) return 1;
                    return 0;
                });

                itensOrdenados.forEach(v => {
                    const thumbnail = v.snippet.thumbnails.default.url;
                    const tituloVid = v.snippet.title;
                    const nomeCanalVid = v.snippet.channelTitle;
                    const videoId = v.id.videoId;

                    const item = document.createElement('div');
                    item.className = 'item-resultado';
                    item.innerHTML = `
                        <img src="${thumbnail}" alt="Thumbnail">
                        <div class="info-resultado">
                            <span class="titulo-video">${tituloVid}</span>
                            <span class="nome-canal">📺 ${nomeCanalVid}</span>
                        </div>
                    `;
                    item.onclick = () => enviarPedido(videoId, tituloVid, cantor);
                    divResultados.appendChild(item);
                });

            } catch (err) {
                divResultados.innerHTML = "<p style='color:#e52d27;'>Erro ao buscar. Tente novamente.</p>";
            }
        }

        function enviarPedido(videoId, titulo, cantor) {
            if (confirm(`Deseja pedir a música:\n\n"${titulo}"\npara ${cantor}?`)) {
                database.ref('pedidos').push({
                    videoId: videoId,
                    titulo: titulo,
                    cantor: cantor,
                    timestamp: Date.now()
                });
                alert("🎵 Pedido enviado com sucesso para o DJ!");
                document.getElementById('termoBuscaCliente').value = "";
                document.getElementById('resultadosCliente').innerHTML = "";
            }
        }

        function enviarVoto(tipoVoto) {
            if (!idVotacaoAtual) return alert("Nenhuma música ativa para votação no momento!");
            if (jaVotadoNestaMusica) return alert("Você já votou nesta apresentação!");

            // Gera um ID único simples por dispositivo/voto para evitar duplicidade rápida
            let meuTokenVoto = localStorage.getItem('tokenVotoCliente');
            if (!meuTokenVoto) {
                meuTokenVoto = 'voto_' + Math.random().toString(36.substring(2));
                localStorage.setItem('tokenVotoCliente', meuTokenVoto);
            }

            database.ref('votosAtual').child(idVotacaoAtual).child(meuTokenVoto).set({
                tipo: tipoVoto,
                timestamp: Date.now()
            }).then(() => {
                jaVotadoNestaMusica = true;
                document.getElementById('botoes-voto-container').style.display = 'none';
                document.getElementById('mensagem-votado').style.display = 'block';
            });
        }
    </script>
</body>
</html>

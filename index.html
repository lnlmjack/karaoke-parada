<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Painel do DJ - Karaokê</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; padding: 20px; margin: 0; }
        .container { max-width: 1600px; margin: 0 auto; position: relative; }
        
        .topo-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
        .topo-botoes-acao { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        
        .btn-topo-acao { padding: 8px 12px; border-radius: 5px; cursor: pointer; font-size: 13px; font-weight: bold; border: 1px solid #555; transition: 0.2s; display: inline-flex; align-items: center; gap: 5px; }
        #btn-reset-tudo { background: #b31217; color: #fff; border-color: #ff5252; } #btn-reset-tudo:hover { background: #e52d27; }
        #btn-sair { background: transparent; color: #aaa; } #btn-sair:hover { color: #fff; background: #e52d27; border-color: #e52d27; }
        #btn-config { background: #ffc107; color: #000; border-color: #e0a800; display: none; } #btn-config:hover { background: #e0a800; }
        #btn-manual { background: #333; color: #fff; } #btn-manual:hover { background: #444; border-color: #00d2ff; }
        #btn-central-fotos { background: #28a745; color: #fff; border-color: #218838; } #btn-central-fotos:hover { background: #218838; }
        #btn-toggle-bloqueio { background: #28a745; color: #fff; border-color: #218838; }

        .area-botoes-topo { display: flex; gap: 15px; margin-bottom: 15px; }
        .btn-topo { flex: 1; padding: 15px; font-size: 16px; font-weight: bold; color: white; border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: 0.3s;}
        .btn-tv { background: #007bff; } .btn-tv:hover { background: #0056b3; } .btn-tv.conectado { background: #17a2b8; pointer-events: none; }
        .btn-mic { background: #e52d27; text-align: center; display: flex; align-items: center; justify-content: center; } 
        .btn-mic:hover { filter: brightness(1.2); }

        .area-busca { display: flex; gap: 10px; margin-bottom: 15px; }
        input { flex: 1; padding: 12px; border-radius: 5px; border: none; font-size: 16px; }
        .btn-buscar { padding: 12px 25px; background: #e52d27; color: white; border: none; font-weight: bold; font-size: 16px; cursor: pointer;}
        
        .canais-preferidos { display: flex; gap: 5px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; font-size: 11px; color: #777; background: #161616; padding: 6px 10px; border-radius: 4px; border: 1px solid #282828; }
        .chip-canal { background: #222; border: 1px solid #444; padding: 2px 7px; border-radius: 10px; color: #ccc; display: inline-flex; align-items: center; gap: 3px; font-size: 10px; }
        .chip-canal .ordem-badge { background: rgba(0,0,0,0.5); padding: 1px 3px; border-radius: 6px; font-size: 8px; color: #ffeb3b; }

        .paineis { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; }
        .painel { background: #1e1e1e; padding: 15px; border-radius: 8px; height: 450px; overflow-y: auto; position: relative;}
        
        .item-resultado, .item-fila, .item-historico, .item-ranking { margin: 10px 0; padding: 12px; background: #333; border-radius: 5px; }
        .item-resultado { cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 10px; position: relative; } 
        .item-resultado:hover { background: #e52d27; }
        .item-resultado img { width: 70px; height: 50px; object-fit: cover; border-radius: 4px; flex-shrink: 0; }
        
        .info-resultado { flex: 1; display: flex; flex-direction: column; }
        .info-resultado .titulo-video { font-size: 13px; font-weight: bold; line-height: 1.2; }
        .info-resultado .nome-canal { font-size: 11px; color: #00d2ff; margin-top: 4px; font-weight: bold; }
        
        .item-fila { border-left: 5px solid #e52d27; display: flex; justify-content: space-between; align-items: center; }
        .titulo-musica { flex: 1; font-size: 14px; } .nome-cantor { color: #aaa; font-size: 12px; display: block; font-style: italic; }
        .botoes-acao { display: flex; gap: 3px; } .btn-acao { background: transparent; border: none; cursor: pointer; font-size: 16px; padding: 5px; transition: 0.2s;} .btn-acao:hover { transform: scale(1.2); }
        
        .item-historico { border-left: 5px solid #28a745; color: #888; font-size: 14px; background: #222; }
        .item-ranking { border-left: 5px solid #ffeb3b; background: #222; font-size: 14px; display: flex; flex-direction: column; align-items: stretch; transition: 0.2s; }
        .item-ranking:hover { background: #2a2a2a; }
        .info-ranking { flex: 1; } .pontuacao { font-size: 26px; color: #ffeb3b; font-weight: 900; margin-left: 10px; }
        
        .item-tocando-agora { border-left: 5px solid #00d2ff; background: #1a2634; font-size: 14px; display: flex; flex-direction: column; align-items: stretch; margin: 10px 0; padding: 12px; border-radius: 5px; }

        #contador-votos { background: #e52d27; padding: 4px 10px; border-radius: 20px; font-weight: bold; font-size: 11px; cursor: pointer; transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.5); display: inline-block; }
        #contador-votos:hover { transform: scale(1.05); background: #c21a15; }

        #modal-votos { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1a1a1a; padding: 30px; border-radius: 12px; z-index: 200; box-shadow: 0 10px 40px rgba(0,0,0,0.9); border: 2px solid #e52d27; width: 300px; }
        #modal-votos h2 { margin-top: 0; color: #fff; text-align: center; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .linha-voto { display: flex; justify-content: space-between; font-size: 20px; margin: 12px 0; border-bottom: 1px dashed #333; padding-bottom: 5px; }
        #fundo-modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); z-index: 199; }

        .btn-limpar-painel { background: #333; color: #aaa; border: none; font-size: 11px; padding: 3px 8px; border-radius: 4px; cursor: pointer; transition: 0.2s; }
        .btn-limpar-painel:hover { background: #e52d27; color: #fff; }

        #modal-manual-conteudo { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1a1a1a; padding: 30px; border-radius: 12px; z-index: 300; box-shadow: 0 10px 40px rgba(0,0,0,0.9); border: 2px solid #00d2ff; width: 90%; max-width: 850px; max-height: 85vh; overflow-y: auto; color: #ddd; text-align: left; }
        #modal-manual-conteudo h2 { color: #00d2ff; border-bottom: 1px solid #333; padding-bottom: 10px; margin-top: 0; font-size: 22px; text-align: center;}
        #modal-manual-conteudo h3 { color: #ffeb3b; margin-top: 20px; margin-bottom: 8px; font-size: 16px; border-left: 4px solid #e52d27; padding-left: 10px; }
        #modal-manual-conteudo p, #modal-manual-conteudo li { line-height: 1.5; font-size: 14px; }
        #modal-manual-conteudo ul { margin-top: 5px; margin-bottom: 12px; padding-left: 20px; }
        #fundo-modal-manual { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 299; }
        
        .versao-app { position: fixed; bottom: 4px; right: 8px; font-size: 12px; color: #fff; opacity: 0.3; z-index: 200005; display: flex; align-items: center; gap: 6px; }
        .versao-app span { color: #fff; }
        .versao-app:hover { opacity: 1; }

        #fundo-modal-config, #fundo-modal-cantor { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 500; }
        #modal-config, #modal-cantor { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1a1a1a; padding: 25px; border-radius: 12px; z-index: 501; box-shadow: 0 10px 40px rgba(0,0,0,0.9); width: 90%; max-width: 550px; color: #fff; max-height: 85vh; overflow-y: auto; }
        #modal-config { border: 2px solid #ffc107; } #modal-cantor { border: 2px solid #00d2ff; text-align: center; }

        #fundo-modal-central-fotos { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 600; }
        #modal-central-fotos { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1a1a1a; padding: 25px; border-radius: 12px; z-index: 601; box-shadow: 0 10px 40px rgba(0,0,0,0.9); width: 90%; max-width: 650px; max-height: 85vh; overflow-y: auto; border: 2px solid #28a745; color: #fff; }

        #fundo-modal-visualizar { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.9); z-index: 250000; }
        #modal-visualizar { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1a1a1a; padding: 20px; border-radius: 12px; z-index: 250001; box-shadow: 0 10px 40px rgba(0,0,0,0.9); width: 90%; max-width: 500px; color: #fff; max-height: 90vh; overflow-y: auto; border: 2px solid #ffeb3b; text-align: center; box-sizing: border-box; }

        .abas-config { display: flex; gap: 10px; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; flex-wrap: wrap; }
        .btn-aba { background: #222; border: 1px solid #444; color: #aaa; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 12px; }
        .btn-aba.ativo { background: #ffc107; color: #000; border-color: #ffc107; }
        .conteudo-aba { display: none; } .conteudo-aba.ativo { display: block; }

        .tabela-canais, .tabela-usuarios { width: 100%; margin-bottom: 15px; border-collapse: collapse; text-align: left; font-size: 13px; }
        .tabela-canais th, .tabela-canais td, .tabela-usuarios th, .tabela-usuarios td { padding: 6px; border-bottom: 1px solid #333; }
        .tabela-canais th { color: #ffc107; } .tabela-usuarios th { color: #007bff; }
        
        .form-novo-canal, .form-novo-usuario { background: #222; padding: 12px; border-radius: 8px; margin-top: 10px; }
        .form-novo-canal input, .form-novo-usuario input, .form-novo-usuario select { width: 100%; padding: 8px; margin-bottom: 8px; border-radius: 5px; border: 1px solid #555; background: #111; color: #fff; box-sizing: border-box; font-size: 13px; }
        
        #input-nome-cantor { width: 100%; padding: 12px; border-radius: 5px; border: 1px solid #555; background: #222; color: #fff; font-size: 16px; margin-bottom: 15px; box-sizing: border-box; }
        #lista-cantores-salvos { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; max-height: 150px; overflow-y: auto; justify-content: center; }
        .chip-cantor { background: #333; border: 1px solid #555; padding: 6px 12px; border-radius: 20px; font-size: 14px; display: flex; align-items: center; gap: 8px; transition: 0.2s; }
        .chip-cantor:hover { background: #444; border-color: #00d2ff; }
        .chip-cantor span { cursor: pointer; flex: 1; }
        .btn-acao-chip { background: transparent; border: none; cursor: pointer; font-size: 12px; color: #aaa; padding: 0; margin: 0;}
        
        /* BOTÕES DE ADICIONAR NA FILA (NORMAL OU TOPO) */
        .botoes-modal-cantor { display: flex; flex-direction: column; gap: 10px; }
        .btn-confirmar { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px;}
        .btn-cancelar { width: 100%; padding: 12px; background: #e52d27; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px;}
        .btn-limpar-cantores { margin-top: 15px; background: transparent; border: none; color: #aaa; text-decoration: underline; cursor: pointer; font-size: 12px; width: 100%; text-align: center;}

        /* Tela de Login */
        #tela-login { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #1a1a1a; z-index: 200000; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        .login-box { background: #222; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.9); text-align: center; width: 100%; max-width: 350px; }
        .login-box img { width: 140px; margin-bottom: 20px; border-radius: 50%; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .login-box h2 { color: #e52d27; font-size: 26px; margin-top: 0; margin-bottom: 25px; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: bold; }
        .login-input { width: 100%; padding: 15px; margin-bottom: 15px; background: #333; border: 1px solid #444; border-radius: 6px; color: white; font-size: 16px; box-sizing: border-box; }
        .login-btn { width: 100%; padding: 15px; background: #e52d27; color: white; font-size: 18px; font-weight: bold; border: 2px solid #fff; border-radius: 6px; cursor: pointer; transition: 0.2s; margin-top: 5px; }
        .login-btn:hover { background: #c21a15; }
    </style>
</head>
<body>

    <div id="tela-login">
        <div class="login-box">
            <img src="logop.png" alt="Logo Parada 10.95">
            <h2>🔒 Painel do DJ</h2>
            <input type="text" id="login-usuario" class="login-input" placeholder="Usuário">
            <input type="password" id="login-senha" class="login-input" placeholder="Senha" onkeypress="if(event.key === 'Enter') fazerLogin()">
            <button class="login-btn" onclick="fazerLogin()">Entrar</button>
        </div>
    </div>

    <div id="fundo-modal-config" onclick="fecharModalConfig()"></div>
    <div id="modal-config">
        <h2>⚙️ Configurações do Sistema</h2>
        <div class="abas-config">
            <button class="btn-aba ativo" onclick="mudarAba('canais', this)">⭐ Canais Favoritos</button>
            <button class="btn-aba" onclick="mudarAba('usuarios', this)">👥 Usuários</button>
            <button class

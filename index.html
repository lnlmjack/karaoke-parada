<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Painel do DJ - Karaokê</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; padding: 20px; margin: 0; }
        .container { max-width: 1600px; margin: 0 auto; position: relative; }

        .area-botoes-topo { display: flex; gap: 15px; margin-bottom: 25px; }
        .btn-topo { flex: 1; padding: 15px; font-size: 16px; font-weight: bold; color: white; border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: 0.3s;}
        .btn-tv { background: #007bff; } .btn-tv:hover { background: #0056b3; } .btn-tv.conectado { background: #17a2b8; pointer-events: none; }
        .btn-mic { background: #e52d27; text-align: center; display: flex; align-items: center; justify-content: center; } 
        .btn-mic:hover { filter: brightness(1.2); }

        .btn-tocar { background: #28a745; width: 100%; padding: 15px; font-size: 16px; font-weight: bold; color: white; border: none; border-radius: 8px; cursor: pointer; margin-bottom: 20px;}

        .area-busca { display: flex; gap: 10px; margin-bottom: 15px; }
        input { flex: 1; padding: 12px; border-radius: 5px; border: none; font-size: 16px; }
        .btn-buscar { padding: 12px 25px; background: #e52d27; color: white; border: none; font-weight: bold; font-size: 16px; cursor: pointer;}

        .paineis { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; }
        .painel { background: #1e1e1e; padding: 15px; border-radius: 8px; height: 450px; overflow-y: auto; position: relative;}

        .item-resultado, .item-fila, .item-historico, .item-ranking { margin: 10px 0; padding: 12px; background: #333; border-radius: 5px; }
        .item-resultado { cursor: pointer; transition: 0.2s; } .item-resultado:hover { background: #e52d27; }

        .item-fila { border-left: 5px solid #e52d27; display: flex; justify-content: space-between; align-items: center; }
        .titulo-musica { flex: 1; font-size: 14px; } .nome-cantor { color: #aaa; font-size: 12px; display: block; font-style: italic; }
        .botoes-acao { display: flex; gap: 3px; } .btn-acao { background: transparent; border: none; cursor: pointer; font-size: 16px; padding: 5px; transition: 0.2s;} .btn-acao:hover { transform: scale(1.2); }

        .item-historico { border-left: 5px solid #28a745; color: #888; font-size: 14px; background: #222; }
        .item-ranking { border-left: 5px solid #ffeb3b; background: #222; font-size: 14px; display: flex; flex-direction: column; align-items: stretch; transition: 0.2s; }
        .item-ranking:hover { background: #2a2a2a; }
        .info-ranking { flex: 1; } .pontuacao { font-size: 26px; color: #ffeb3b; font-weight: 900; margin-left: 10px; }

        #contador-votos { position: absolute; top: 15px; right: 15px; background: #e52d27; padding: 8px 12px; border-radius: 20px; font-weight: bold; font-size: 13px; cursor: pointer; transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        #contador-votos:hover { transform: scale(1.05); background: #c21a15; }

        #modal-votos { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1a1a1a; padding: 30px; border-radius: 12px; z-index: 200; box-shadow: 0 10px 40px rgba(0,0,0,0.9); border: 2px solid #e52d27; width: 300px; }
        #modal-votos h2 { margin-top: 0; color: #fff; text-align: center; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .linha-voto { display: flex; justify-content: space-between; font-size: 20px; margin: 12px 0; border-bottom: 1px dashed #333; padding-bottom: 5px; }
        #fundo-modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); z-index: 199; }

        #btn-manual { position: absolute; top: 20px; right: 20px; background: #333; color: #fff; border: 1px solid #555; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-size: 13px; font-weight: bold; z-index: 100; transition: 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.5); }
        #btn-manual:hover { background: #444; border-color: #00d2ff; transform: scale(1.05); }

        #modal-manual-conteudo { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1a1a1a; padding: 30px; border-radius: 12px; z-index: 300; box-shadow: 0 10px 40px rgba(0,0,0,0.9); border: 2px solid #00d2ff; width: 90%; max-width: 800px; max-height: 85vh; overflow-y: auto; color: #ddd; }
        #modal-manual-conteudo h2 { color: #00d2ff; border-bottom: 1px solid #333; padding-bottom: 10px; margin-top: 0; font-size: 24px; text-align: center;}
        #modal-manual-conteudo h3 { color: #ffeb3b; margin-top: 25px; margin-bottom: 10px; font-size: 18px; border-left: 4px solid #e52d27; padding-left: 10px; }
        #modal-manual-conteudo p, #modal-manual-conteudo li { line-height: 1.6; font-size: 15px; }
        #modal-manual-conteudo ul { margin-top: 5px; margin-bottom: 15px; }
        #modal-manual-conteudo .destaque { font-weight: bold; color: #fff; }
        #modal-manual-conteudo .segredo { background: #222; border-left: 4px solid #28a745; padding: 15px; margin-top: 20px; border-radius: 5px; font-style: italic; }
        #fundo-modal-manual { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 299; }

        #versao-canto { position: fixed; bottom: 6px; right: 8px; font-size: 10px; color: #555; z-index: 500; font-family: monospace; }

        /* LOGIN */
        #tela-login { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: radial-gradient(circle at top, #1e1e1e, #000); }
        #tela-login .card-login { background: #1e1e1e; padding: 40px 30px; border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.7); width: 320px; max-width: 90%; text-align: center; border: 2px solid #e52d27; }
        #tela-login h1 { color: #fff; font-size: 22px; margin-bottom: 20px; }
        #tela-login input { width: 100%; box-sizing: border-box; padding: 14px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #333; background: #111; color: #fff; font-size: 15px; }
        #tela-login button { width: 100%; padding: 14px; background: #e52d27; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s ease; }
        #tela-login button:hover { background: #c21a15; }
        #tela-login .mensagem-erro { color: #ffeb3b; margin-top: 15px; font-size: 14px; }
        #tela-login .link-recuperar-senha { color: #007bff; text-decoration: none; font-size: 13px; margin-top: 15px; display: block; }
        #tela-login .link-recuperar-senha:hover { text-decoration: underline; }

        /* PAINEL */
        #painel-principal { display: none; }
        .area-usuario { position: absolute; top: 20px; left: 20px; color: #aaa; font-size: 13px; display: flex; align-items: center; gap: 10px; }
        .area-usuario button { background: #333; color: #fff; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-size: 12px; transition: 0.2s; }
        .area-usuario button:hover { background: #555; }
        .area-usuario #btnAlterarSenha { background: #007bff; }
        .area-usuario #btnAlterarSenha:hover { background: #0056b3; }
    </style>
    <script>
        // Configuração do Firebase (substitua com suas credenciais reais)
        const firebaseConfig = {
            apiKey: "AIzaSyB31OQxX7oO3WqGf8E32e2c2f3g4h5i6j7k8l9m0", // Sua API Key
            authDomain: "karaokeparada.firebaseapp.com",
            databaseURL: "https://karaokeparada-default-rtdb.firebaseio.com",
            projectId: "karaokeparada",
            storageBucket: "karaokeparada.appspot.com",
            messagingSenderId: "1234567890",
            appId: "1:1234567890:web:abcdef1234567890abcdef" // Seu App ID
        };

        // Inicializa o Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const auth = firebase.auth();

        // Variáveis globais
        let telaTV = null;
        let musicaAtual = null;
        let filaDeReproducao = [];
        let historicoDeReproducao = [];
        let ranking = [];
        let timerNota;
        let captando = false;
        let somaEnergia = 0;
        let qtdLeituras = 0;
        let notaForcadaPeloDJ = null;
        const API_KEY = "SUA_CHAVE_API_YOUTUBE"; // Substitua pela sua chave de API do YouTube

        // YouTube Player API
        let player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '0', // Oculto no painel, só para controle
                width: '0',
                events: {
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) {
                tocarProxima(true);
            }
        }

        // Autenticação
        auth.onAuthStateChanged(user => {
            if (user) {
                database.ref('usuarios/' + user.uid).once('value', snapshot => {
                    const userData = snapshot.val();
                    if (userData && userData.ativo) {
                        document.getElementById('tela-login').style.display = 'none';
                        document.getElementById('painel-principal').style.display = 'block';

                        let nomeExibicao = user.email.split('@')[0]; // Pega a parte antes do @
                        nomeExibicao = nomeExibicao.charAt(0).toUpperCase() + nomeExibicao.slice(1); // Capitaliza

                        if (userData.nome) { // Se tiver um campo 'nome' no banco, usa ele
                            nomeExibicao = userData.nome;
                        }

                        document.getElementById('nome-usuario').textContent = nomeExibicao;
                        document.getElementById('email-usuario-logado').textContent = user.email; // Guarda o email para a função de alteração de senha

                        // Inicia listeners do banco de dados
                        database.ref('fila').on('value', snap => { filaDeReproducao = snap.val() || []; atualizarTelaFila(); });
                        database.ref('historico').on('value', snap => { historicoDeReproducao = snap.val() || []; atualizarTelaHistorico(); });
                        database.ref('ranking').on('value', snap => { ranking = snap.val() || []; atualizarTelaRanking(); });
                        database.ref('votosAtual').on('value', snap => {
                            const votos = snap.val();
                            if (votos) {
                                document.getElementById('votos-excelente').textContent = votos.excelente || 0;
                                document.getElementById('votos-muitobom').textContent = votos.muitobom || 0;
                                document.getElementById('votos-bom').textContent = votos.bom || 0;
                                document.getElementById('votos-regular').textContent = votos.regular || 0;
                                document.getElementById('votos-ruim').textContent = votos.ruim || 0;
                                document.getElementById('contador-votos').textContent = Object.values(votos).reduce((acc, val) => acc + val, 0) + " votos ao vivo";
                            } else {
                                document.getElementById('votos-excelente').textContent = 0;
                                document.getElementById('votos-muitobom').textContent = 0;
                                document.getElementById('votos-bom').textContent = 0;
                                document.getElementById('votos-regular').textContent = 0;
                                document.getElementById('votos-ruim').textContent = 0;
                                document.getElementById('contador-votos').textContent = "0 votos ao vivo";
                            }
                        });

                    } else {
                        auth.signOut();
                        document.getElementById('mensagem-erro-login').textContent = "Acesso revogado ou usuário inativo.";
                    }
                });
            } else {
                document.getElementById('tela-login').style.display = 'flex';
                document.getElementById('painel-principal').style.display = 'none';
            }
        });

        async function fazerLogin() {
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const mensagemErro = document.getElementById('mensagem-erro-login');
            mensagemErro.textContent = '';

            try {
                await auth.signInWithEmailAndPassword(email, senha);
            } catch (error) {
                let msg = "Erro desconhecido.";
                switch (error.code) {
                    case 'auth/user-not-found':
                    case 'auth/wrong-password':
                        msg = "E-mail ou senha inválidos.";
                        break;
                    case 'auth/invalid-email':
                        msg = "Formato de e-mail inválido.";
                        break;
                    case 'auth/user-disabled':
                        msg = "Usuário desativado.";
                        break;
                    case 'auth/too-many-requests':
                        msg = "Muitas tentativas de login. Tente novamente mais tarde.";
                        break;
                    case 'auth/network-request-failed':
                        msg = "Erro de conexão. Verifique sua internet.";
                        break;
                    case 'auth/api-key-not-valid':
                        msg = "Erro de configuração: Chave de API inválida.";
                        break;
                    default:
                        msg = `Erro: ${error.message}`;
                }
                mensagemErro.textContent = msg;
            }
        }

        function fazerLogout() {
            auth.signOut();
        }

        // Nova função para alterar senha
        async function alterarSenhaUsuario() {
            const user = auth.currentUser;
            if (user) {
                const email = user.email;
                try {
                    await auth.sendPasswordResetEmail(email);
                    alert(`Um e-mail para redefinição de senha foi enviado para ${email}. Verifique sua caixa de entrada.`);
                } catch (error) {
                    let msg = "Não foi possível enviar o e-mail de redefinição de senha.";
                    if (error.code === 'auth/user-not-found') {
                        msg = "Usuário não encontrado.";
                    } else if (error.code === 'auth/network-request-failed') {
                        msg = "Erro de conexão. Verifique sua internet.";
                    }
                    alert(`Erro ao alterar senha: ${msg} (${error.message})`);
                }
            } else {
                alert("Nenhum usuário logado para alterar a senha.");
            }
        }


        // Funções do Painel (mantidas as mesmas, apenas o volume dos tambores ajustado)
        function iniciarSistemaTV() {
            if (telaTV && !telaTV.closed) {
                alert("A tela da TV já está aberta!");
                return;
            }
            telaTV = window.open('tv.html', 'TelaTV', 'width=1280,height=720');
            if (telaTV) {
                telaTV.onload = () => {
                    document.getElementById('btn-tv').classList.add('conectado');
                    document.getElementById('btn-tv').textContent = '1. SISTEMA E TV CONECTADOS';
                };
            } else {
                alert("Permita pop-ups para este site para abrir a tela da TV.");
            }
        }

        function iniciarAvaliador() {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ audio: true })
                    .then(stream => {
                        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                        const analyser = audioContext.createAnalyser();
                        const microphone = audioContext.createMediaStreamSource(stream);
                        microphone.connect(analyser);
                        analyser.fftSize = 256;
                        const bufferLength = analyser.frequencyBinCount;
                        const dataArray = new Uint8Array(bufferLength);

                        document.getElementById('btn-mic').textContent = '2. AVALIADOR (ATIVO)';
                        document.getElementById('btn-mic').style.backgroundColor = '#28a745';
                        document.getElementById('btn-mic').style.pointerEvents = 'none';

                        function getVolume() {
                            analyser.getByteFrequencyData(dataArray);
                            let sum = 0;
                            for (let i = 0; i < bufferLength; i++) {
                                sum += dataArray[i];
                            }
                            const average = sum / bufferLength;
                            if (captando) {
                                somaEnergia += average;
                                qtdLeituras++;
                            }
                            requestAnimationFrame(getVolume);
                        }
                        getVolume();
                    })
                    .catch(err => {
                        alert("Erro ao acessar o microfone: " + err.message + ". Verifique as permissões.");
                        document.getElementById('btn-mic').textContent = '2. AVALIADOR (ERRO)';
                        document.getElementById('btn-mic').style.backgroundColor = '#dc3545';
                    });
            } else {
                alert("Seu navegador não suporta acesso ao microfone.");
                document.getElementById('btn-mic').textContent = '2. AVALIADOR (NÃO SUPORTADO)';
                document.getElementById('btn-mic').style.backgroundColor = '#dc3545';
            }
        }

        function tocarTambores() {
            const som = new Audio('tambores.mp3');
            som.volume = 0.5; // Volume ajustado para 50%
            som.play();
        }

        document.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') {
                e.preventDefault();
                tocarTambores();
                if (musicaAtual) {
                    let notaBase = parseInt(e.key) * 10;
                    if (e.key === '0') notaBase = 100;
                    else if (e.key === '6') notaBase = 60;
                    else if (e.key === '7') notaBase = 70;
                    else if (e.key === '8') notaBase = 80;
                    else if (e.key === '9') notaBase = 90;

                    notaForcadaPeloDJ = notaBase;
                    if (telaTV && !telaTV.closed) {
                        telaTV.document.getElementById('tela-nota').style.display = 'flex';
                        telaTV.document.getElementById('nota-final').textContent = notaForcadaPeloDJ;
                    }
                }
            }
        });

        function calcularNota() {
            captando = false;
            let notaFinal;
            if (notaForcadaPeloDJ !== null) {
                notaFinal = notaForcadaPeloDJ;
            } else if (qtdLeituras > 0) {
                const mediaEnergia = somaEnergia / qtdLeituras;
                const votos = {
                    excelente: parseInt(document.getElementById('votos-excelente').textContent),
                    muitobom: parseInt(document.getElementById('votos-muitobom').textContent),
                    bom: parseInt(document.getElementById('votos-bom').textContent),
                    regular: parseInt(document.getElementById('votos-regular').textContent),
                    ruim: parseInt(document.getElementById('votos-ruim').textContent)
                };

                const totalVotos = votos.excelente + votos.muitobom + votos.bom + votos.regular + votos.ruim;
                let notaVotos = 0;
                if (totalVotos > 0) {
                    notaVotos = (votos.excelente * 100 + votos.muitobom * 90 + votos.bom * 75 + votos.regular * 50 + votos.ruim * 20) / totalVotos;
                }

                const notaMicrofone = Math.min(100, Math.max(0, (mediaEnergia - 30) * 1.5));
                notaFinal = Math.round((notaMicrofone * 0.4) + (notaVotos * 0.6));
            } else {
                notaFinal = 50; // Nota padrão se não houver dados
            }

            if (musicaAtual) {
                ranking.push({
                    nome: musicaAtual.cantor,
                    titulo: musicaAtual.titulo,
                    nota: notaFinal,
                    votos: {
                        excelente: parseInt(document.getElementById('votos-excelente').textContent),
                        muitobom: parseInt(document.getElementById('votos-muitobom').textContent),
                        bom: parseInt(document.getElementById('votos-bom').textContent),
                        regular: parseInt(document.getElementById('votos-regular').textContent),
                        ruim: parseInt(document.getElementById('votos-ruim').textContent)
                    }
                });
                database.ref('ranking').set(ranking);
                atualizarTelaRanking();
            }

            if (telaTV && !telaTV.closed) {
                telaTV.document.getElementById('tela-nota').style.display = 'flex';
                telaTV.document.getElementById('nota-final').textContent = notaFinal;
            }
            clearTimeout(timerNota);
            timerNota = setTimeout(() => {
                if (telaTV && !telaTV.closed) telaTV.document.getElementById('tela-nota').style.display = 'none';
                musicaAtual = null; tocarProxima(true); 
            }, 12000);
        }

        function extrairVideoId(url) {
            const regex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i;
            const match = url.match(regex);
            return match ? match[1] : null;
        }

        async function buscarNoYouTube() {
            const termo = document.getElementById('campoBusca').value; if (!termo) return;
            const div = document.getElementById('resultados'); div.innerHTML = ''; 

            const videoId = extrairVideoId(termo);
            if (videoId) {
                const c = prompt("🎤 Link reconhecido! Qual a voz dessa música?"); if(c === null) return;
                filaDeReproducao.push({ videoId: videoId, titulo: "Música via Link", cantor: c.trim() === "" ? "Convidados" : c });
                atualizarTelaFila(); document.getElementById('campoBusca').value = ""; return;
            }

            const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=10&q=${encodeURIComponent(termo + " karaoke -oficial -clipe -live")}&type=video&key=${API_KEY}`;
            try {
                const res = await fetch(url); const dados = await res.json();
                dados.items.forEach(v => {
                    const d = document.createElement('div'); d.className = 'item-resultado'; d.innerHTML = v.snippet.title; 
                    d.onclick = () => {
                        const c = prompt("🎤 Qual a voz dessa música?"); if(c === null) return;
                        filaDeReproducao.push({ videoId: v.id.videoId, titulo: v.snippet.title, cantor: c.trim() === "" ? "Convidados" : c });
                        atualizarTelaFila();
                    };
                    div.appendChild(d);
                });
            } catch (err) { div.innerHTML = "<p style='color:#e52d27'>Limite de busca atingido. Cole o link direto!</p>"; }
        }

        function removerMusica(i) { filaDeReproducao.splice(i, 1); atualizarTelaFila(); }
        function moverMusica(i, d) { const t = filaDeReproducao[i]; filaDeReproducao[i] = filaDeReproducao[i+d]; filaDeReproducao[i+d] = t; atualizarTelaFila(); }

        function iniciarMusica(m) {
            clearTimeout(timerNota);
            if (telaTV && !telaTV.closed) telaTV.document.getElementById('tela-nota').style.display = 'none';

            database.ref('votosAtual').remove();
            database.ref('statusAtual').set({ cantor: m.cantor, titulo: m.titulo, id: Date.now() });

            musicaAtual = m; historicoDeReproducao.push(m);
            atualizarTelaFila(); atualizarTelaHistorico();

            if (telaTV && !telaTV.closed && m.cantor !== "Convidados") {
                telaTV.document.getElementById('cantor-overlay').innerHTML = `<div style="display:inline-block; vertical-align:middle;"><span class="aviso">Com a Voz</span><p class="nome">${m.cantor}</p></div>`;

                telaTV.document.getElementById('cantor-overlay').style.top = '-200px'; 
                setTimeout(() => telaTV.document.getElementById('cantor-overlay').style.top = '20px', 100);
            }
            captando = true; somaEnergia = 0; qtdLeituras = 0; notaForcadaPeloDJ = null;
            player.loadVideoById(m.videoId); player.playVideo(); 
        }

        function tocarMusicaEspecifica(i) { 
            if(!telaTV || telaTV.closed) return alert("⚠️ A Tela da TV está fechada! Clique no botão azul '1. INICIAR SISTEMA E TV' antes de tocar a música."); 
            iniciarMusica(filaDeReproducao.splice(i, 1)[0]); 
        }

        function tocarProxima(auto = false) {
            if(!telaTV || telaTV.closed) {
                if (!auto) alert("⚠️ A Tela da TV está fechada! Clique no botão azul '1. INICIAR SISTEMA E TV' antes de tocar a música.");
                return;
            }
            if(filaDeReproducao.length > 0) {
                iniciarMusica(filaDeReproducao.shift()); 
            } else {
                if(telaTV && !telaTV.closed) telaTV.document.getElementById('cantor-overlay').style.top = '-200px';
                database.ref('statusAtual').set(null);
            }
        }

        function atualizarTelaFila() {
            document.getElementById('fila').innerHTML = filaDeReproducao.map((item, i) => `
                <div class="item-fila">
                    <span class="titulo-musica"><strong>${i+1}º</strong> - ${item.titulo} <br> <span class="nome-cantor">🎤 Voz: ${item.cantor}</span></span>
                    <div class="botoes-acao">
                        <button class="btn-acao" onclick="tocarMusicaEspecifica(${i})">▶️</button>
                        ${i > 0 ? `<button class="btn-acao" onclick="moverMusica(${i}, -1)">⬆️</button>` : ''}
                        ${i < filaDeReproducao.length - 1 ? `<button class="btn-acao" onclick="moverMusica(${i}, 1)">⬇️</button>` : ''}
                        <button class="btn-acao" onclick="removerMusica(${i})">❌</button>
                    </div>
                </div>
            `).join('');
        }

        function atualizarTelaHistorico() { document.getElementById('historico').innerHTML = historicoDeReproducao.slice().reverse().map(item => `<div class="item-historico">✔️ ${item.titulo} <br> <span class="nome-cantor">🎤 Voz: ${item.cantor}</span></div>`).join(''); }

        function atualizarTelaRanking() {
            document.getElementById('ranking').innerHTML = [...ranking].sort((a,b) => b.nota - a.nota).map((item, i) => `
                <div class="item-ranking" onclick="document.getElementById('votos-rank-${i}').style.display = document.getElementById('votos-rank-${i}').style.display === 'none' ? 'block' : 'none'" style="cursor:pointer;" title="Clique para ver os votos!">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <div class="info-ranking">
                            ${i === 0 ? '👑' : '⭐'} <strong>${i+1}º Lugar</strong> <br> 
                            🎤 ${item.nome} <br> 
                            <span style="font-size:11px;">🎵 ${item.titulo}</span><br>
                            <span style="font-size:10px; color:#aaa; font-style:italic;">(Clique para ver votos)</span>
                        </div>
                        <div class="pontuacao">${item.nota}</div>
                    </div>

                    <div id="votos-rank-${i}" style="display:none; margin-top: 15px; background: #111; padding: 10px; border-radius: 5px; font-size: 13px; text-align: center;">
                        <strong>Registro da Plateia:</strong><br><br>
                        <span style="color:#00d2ff">🤯 ${item.votos.excelente}</span> &nbsp;|&nbsp; 
                        <span style="color:#28a745">🤩 ${item.votos.muitobom}</span> &nbsp;|&nbsp; 
                        <span style="color:#ffeb3b">🙂 ${item.votos.bom}</span> &nbsp;|&nbsp; 
                        <span style="color:#fd7e14">😕 ${item.votos.regular}</span> &nbsp;|&nbsp; 
                        <span style="color:#e52d27">😖 ${item.votos.ruim}</span>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
